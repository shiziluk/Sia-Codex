name: Bug report
description: Report a reproducible problem in Sia-Codex.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not post API keys, cookies, tokens, account names, private paths, or full logs containing personal data.
        Remove secrets before attaching diagnostics.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Sansheng orchestration
        - Manager UI
        - Native browser enhancement
        - Agent adapters
        - Build or packaging
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Sia-Codex revision
      description: Commit hash or release name.
      placeholder: 12a21e9
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version and relevant Codex/CLI version.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Remove credentials, account identifiers, and private filesystem paths.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, account identifiers, and private data from this report.
          required: true
        - label: I understand this is an unofficial downstream project, not the upstream CodexPlusPlus release.
          required: true
